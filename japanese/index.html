<style>
/* Layout: one narrow study column; a genkō-yōshi (原稿用紙) card is the hero, tabs sit in a sticky header. */
:root {
  --paper: #eef1f4;
  --sheet: #fbfcfd;
  --ink: #1a2232;
  --ink-soft: #5b6578;
  --rule: #d5dbe4;
  --grid: #dfe6ef;
  --ai: #2c4a8c;        /* 藍 indigo: primary accent */
  --ai-wash: #e3e9f6;
  --shu: #c8432c;       /* 朱 vermilion: forgot */
  --yamabuki: #b9800f;  /* 山吹 amber: hard */
  --matcha: #3b7f4f;    /* 抹茶 green: easy / learned */
  --font-jp: "Klee One", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-ui: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --step--1: 0.8125rem;
  --step-0: 0.9375rem;
  --step-1: 1.125rem;
  --step-2: 1.5rem;
  --step-4: 2.75rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11151d; --sheet: #181e29; --ink: #e5e9f1; --ink-soft: #9aa4b6;
    --rule: #2b3444; --grid: #222b39; --ai: #8ea9ec; --ai-wash: #1f2a42;
    --shu: #ec7a63; --yamabuki: #e0ae4a; --matcha: #73c08a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11151d; --sheet: #181e29; --ink: #e5e9f1; --ink-soft: #9aa4b6;
  --rule: #2b3444; --grid: #222b39; --ai: #8ea9ec; --ai-wash: #1f2a42;
  --shu: #ec7a63; --yamabuki: #e0ae4a; --matcha: #73c08a; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-ui); font-size: var(--step-0); line-height: 1.6;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.wrap {
  max-width: 600px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--paper); padding-block: 14px 0;
  display: grid; gap: 10px; border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { margin: 0; font-family: var(--font-jp); font-weight: 600; font-size: var(--step-2); letter-spacing: 0.04em; text-wrap: balance; }
.brand .meta { color: var(--ink-soft); font-size: var(--step--1); font-variant-numeric: tabular-nums; }
nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
nav button {
  border: 0; background: none; color: var(--ink-soft); font: inherit; font-weight: 500;
  padding: 8px 12px 10px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap;
}
nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ai); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
main { padding-top: 18px; display: grid; gap: 18px; }
section[hidden] { display: none; }
.view { display: grid; gap: 16px; }

/* Study card */
.progress { display: flex; align-items: center; gap: 10px; font-size: var(--step--1); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 4px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ai); width: 0; transition: width .25s; }
.card {
  background-color: var(--sheet);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px; background-position: -1px -1px;
  border: 1px solid var(--rule); border-radius: 6px;
  min-height: 300px; padding: 22px 20px; display: grid; align-content: space-between; gap: 18px;
  cursor: pointer; user-select: none;
}
.card .tag { display: flex; gap: 8px; align-items: center; font-size: var(--step--1); color: var(--ink-soft); }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--rule); background: var(--sheet); font-size: 0.75rem; letter-spacing: 0.04em; }
.pill.new { color: var(--ai); border-color: var(--ai); }
.pill.lapse { color: var(--shu); border-color: var(--shu); }
.pill.note { color: var(--matcha); border-color: var(--matcha); }
.face { text-align: center; display: grid; gap: 6px; justify-items: center; }
.face .ruby { font-family: var(--font-jp); font-size: var(--step-1); color: var(--ink-soft); min-height: 1.6em; }
.face .big { font-family: var(--font-jp); font-size: var(--step-4); line-height: 1.25; font-weight: 600; word-break: keep-all; overflow-wrap: anywhere; background: var(--sheet); padding: 0 8px; }
.face .big.zh { font-family: var(--font-ui); font-size: 2rem; font-weight: 700; }
.face .big.pattern { font-size: 2rem; }
.answer { border-top: 1px dashed var(--rule); padding-top: 14px; display: grid; gap: 8px; text-align: left; background: var(--sheet); }
.answer .mean { font-size: var(--step-1); font-weight: 500; white-space: pre-line; }
.answer .jp { font-family: var(--font-jp); font-size: var(--step-1); white-space: pre-line; }
.answer .zh { color: var(--ink-soft); white-space: pre-line; }
.answer .note { font-size: var(--step--1); color: var(--ink-soft); white-space: pre-line; }
.hint { text-align: center; color: var(--ink-soft); font-size: var(--step--1); background: var(--sheet); justify-self: center; padding: 0 6px; }
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.grades.two { grid-template-columns: repeat(2, 1fr); }
.grades button {
  font: inherit; font-weight: 700; padding: 10px 4px 8px; border-radius: 6px; cursor: pointer;
  border: 1px solid currentColor; background: var(--sheet); display: grid; gap: 0; line-height: 1.3;
}
.grades button small { font-weight: 400; font-size: 0.75rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.g0 { color: var(--shu); } .g1 { color: var(--yamabuki); } .g2 { color: var(--ai); } .g3 { color: var(--matcha); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn {
  font: inherit; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink);
  padding: 7px 14px; border-radius: 6px; cursor: pointer;
}
.btn.primary { background: var(--ai); border-color: var(--ai); color: var(--sheet); font-weight: 700; }
.btn.ghost { background: none; }
.btn.small { padding: 4px 10px; font-size: var(--step--1); }
.btn.danger { color: var(--shu); border-color: var(--shu); }
.done { text-align: center; padding: 36px 16px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; display: grid; gap: 12px; justify-items: center; }
.done .stamp {
  font-family: var(--font-jp); font-weight: 600; font-size: 1.6rem; color: var(--shu);
  border: 3px solid var(--shu); border-radius: 50%; width: 92px; height: 92px; display: grid; place-items: center; transform: rotate(-8deg);
}
.ai-box { border: 1px solid var(--rule); border-radius: 6px; padding: 12px; display: grid; gap: 8px; background: var(--sheet); cursor: auto; user-select: text; }
.ai-box textarea, .ai-box input { width: 100%; }
.ai-out { white-space: pre-wrap; font-size: var(--step-0); line-height: 1.7; }
.ai-out:empty { display: none; }

/* Lists */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button {
  font: inherit; font-variant-numeric: tabular-nums; min-width: 40px; padding: 4px 10px; border-radius: 999px;
  border: 1px solid var(--rule); background: var(--sheet); color: var(--ink-soft); cursor: pointer;
}
.chips button[aria-pressed="true"] { background: var(--ai); color: var(--sheet); border-color: var(--ai); }
.chips button.future { opacity: 0.55; }
input[type="search"], input[type="text"], input[type="number"], select, textarea {
  font: inherit; color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px;
}
textarea { resize: vertical; min-height: 64px; }
.list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.list li { display: grid; grid-template-columns: 10px minmax(0, 1fr) minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--rule); }
.list .w { font-family: var(--font-jp); font-size: var(--step-1); line-height: 1.3; min-width: 0; }
.list .w small { display: block; font-size: var(--step--1); color: var(--ink-soft); }
.list .m { min-width: 0; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--rule); }
.dot.learning { background: var(--yamabuki); }
.dot.known { background: var(--matcha); }
.dot.due { background: var(--shu); }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: var(--step--1); color: var(--ink-soft); align-items: center; }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.icon-btn { border: 0; background: none; color: var(--ai); cursor: pointer; font: inherit; font-size: var(--step--1); padding: 4px 6px; }

.gram { border: 1px solid var(--rule); background: var(--sheet); border-radius: 6px; padding: 14px 16px; display: grid; gap: 8px; }
.gram h3 { margin: 0; font-family: var(--font-jp); font-size: var(--step-1); font-weight: 600; display: flex; justify-content: space-between; gap: 8px; align-items: baseline; flex-wrap: wrap; }
.gram .mean { font-weight: 500; white-space: pre-line; }
.gram .ex { border-left: 2px solid var(--ai-wash); padding-left: 10px; }
.gram .ex .jp { font-family: var(--font-jp); font-size: var(--step-1); white-space: pre-line; }
.gram .ex .zh { color: var(--ink-soft); font-size: var(--step--1); white-space: pre-line; }
.gram .note { font-size: var(--step--1); color: var(--ink-soft); white-space: pre-line; }

/* Stats */
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; }
.tile { background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; }
.tile b { display: block; font-size: var(--step-2); font-variant-numeric: tabular-nums; line-height: 1.2; }
.tile span { font-size: var(--step--1); color: var(--ink-soft); }
.lessons { display: grid; gap: 6px; }
.lrow { display: grid; grid-template-columns: 48px minmax(0, 1fr) 76px; gap: 10px; align-items: center; font-size: var(--step--1); font-variant-numeric: tabular-nums; }
.stack { display: flex; height: 12px; border-radius: 3px; overflow: hidden; background: var(--rule); }
.stack i { display: block; height: 100%; }
.stack .k { background: var(--matcha); } .stack .l { background: var(--yamabuki); }
.week { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; }
.week i { aspect-ratio: 1; border-radius: 3px; background: var(--rule); max-width: 100%; }
.week i.on1 { background: color-mix(in srgb, var(--matcha) 45%, var(--rule)); }
.week i.on2 { background: var(--matcha); }
.week i.today { outline: 1px solid var(--ink-soft); }

.form { display: grid; gap: 12px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 16px; }
.form label { display: grid; gap: 4px; font-size: var(--step--1); color: var(--ink-soft); }
.form .two { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
h2 { font-size: var(--step-1); margin: 4px 0 0; text-wrap: balance; }
.muted { color: var(--ink-soft); font-size: var(--step--1); }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--paper); padding: 8px 16px; border-radius: 6px; font-size: var(--step--1); z-index: 20; }
@media (max-width: 420px) {
  .list li { grid-template-columns: 10px minmax(0, 1fr) auto; }
  .list li .m { grid-column: 2 / 3; grid-row: 2; }
  .form .two { grid-template-columns: 1fr; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

  S.upd = Date.now();
  try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveRemote, 1500);
}
async function saveRemote() {
  if (!stateRef) return;
  if (writing) { writeAgain = true; return; }
  writing = true;
  try { await stateRef.set(JSON.parse(JSON.stringify(S))); } catch (e) { if (e && e.code === "quota_exceeded") toast("雲端儲存已滿，進度只存喺呢部機"); }
  writing = false;
  if (writeAgain) { writeAgain = false; saveRemote(); }
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden" && saveTimer) { clearTimeout(saveTimer); saveRemote(); } });

/* ===== 間隔重複 ===== */
function schedule(st, g) {
  st = Object.assign({ i: 0, e: 2.5, r: 0, l: 0 }, st);
  if (g === 0) { st.l++; st.r = 0; st.i = 0; st.e = Math.max(1.3, st.e - 0.2); }
  else if (g === 1) { st.i = st.r === 0 ? 1 : Math.max(st.i + 1, Math.round(st.i * 1.2)); st.e = Math.max(1.3, st.e - 0.15); st.r++; }
  else if (g === 2) { st.i = st.r === 0 ? 1 : st.r === 1 ? 3 : Math.max(st.i + 1, Math.round(st.i * st.e)); st.r++; }
  else { st.i = st.r === 0 ? 3 : st.r === 1 ? 6 : Math.max(st.i + 2, Math.round(st.i * st.e * 1.3)); st.e += 0.15; st.r++; }
  st.d = today() + st.i; st.s = today();
  return st;
}
const fmtIv = (i) => i === 0 ? "今日再嚟" : i < 30 ? i + "日" : i < 365 ? Math.round(i / 30) + "個月" : (i / 365).toFixed(1) + "年";
function status(c) {
  const st = S.c[c.id];
  if (!st) return "new";
  if (st.d <= today()) return "due";
  return st.i >= 7 ? "known" : "learning";
}
const inScope = (c) => c.L <= S.settings.cur && (c.t === "v" || S.settings.gram);
// 新卡次序：老師筆記先，之後由第1課開始
const newOrder = (a, b) => (a.src ? 0 : 1) - (b.src ? 0 : 1) || a.L - b.L;

/* ===== 今日溫習 ===== */
let session = null;
function buildSession() {
  const t = today();
  if (S.nt.d !== t) S.nt = { d: t, n: 0 };
  const scope = CARDS.filter(inScope);
  const due = scope.filter((c) => S.c[c.id] && S.c[c.id].d <= t).sort((a, b) => S.c[a.id].d - S.c[b.id].d);
  const left = Math.max(0, S.settings.newPerDay - S.nt.n);
  const fresh = scope.filter((c) => !S.c[c.id]).sort(newOrder).slice(0, left);
  // 新卡穿插喺舊卡之間
  const q = []; let ni = 0;
  due.forEach((c, i) => { q.push(c.id); if (i % 3 === 2 && ni < fresh.length) q.push(fresh[ni++].id); });
  while (ni < fresh.length) q.push(fresh[ni++].id);
  session = { q, i: 0, shown: false, cram: false, done: 0, total: q.length, title: "" };
}
function startCram(L, type) {
  const ids = CARDS.filter((c) => c.L === L && (!type || c.t === type)).map((c) => c.id);
  for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  session = { q: ids, i: 0, shown: false, cram: true, done: 0, total: ids.length, title: "第" + L + "課 自由練習" };
  go("today");
}
function extraNew(n) {
  const fresh = CARDS.filter((c) => inScope(c) && !S.c[c.id]).sort(newOrder).slice(0, n);
  session = { q: fresh.map((c) => c.id), i: 0, shown: false, cram: false, done: 0, total: fresh.length, title: "加多 " + fresh.length + " 張新卡" };
  renderToday();
}

const esc = (s) => String(s == null ? "" : s).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[ch]));
const canSpeak = "speechSynthesis" in window;
function speak(text) {
  if (!canSpeak) return;
  try {
    const u = new SpeechSynthesisUtterance(text.replace(/[～\[\]［］]/g, "").replace(/（.*?）/g, ""));
    u.lang = "ja-JP"; u.rate = 0.85;
    speechSynthesis.cancel(); speechSynthesis.speak(u);
  } catch (e) {}
}
const jpOf = (c) => c.t === "v" ? (c.kanji || c.kana) : c.p;

function cardFace(c, shown) {
  const st = S.c[c.id];
  const tags = [`<span>第${c.L}課 · ${c.t === "v" ? "生字" : "文法"}</span>`];
  if (!st) tags.push(`<span class="pill new">新</span>`);
  else if (st.l > 0 && st.r === 0) tags.push(`<span class="pill lapse">唔記得咗</span>`);
  if (c.src) tags.push(`<span class="pill note">老師筆記</span>`);
  const zhFirst = c.t === "v" && S.settings.dir === "zj";
  let front, back;
  if (c.t === "v") {
    const ruby = c.kanji ? c.kana : "";
    if (zhFirst) {
      front = `<div class="face"><div class="ruby"></div><div class="big zh">${esc(c.mean)}</div></div>`;
      back = `<div class="answer"><div class="jp" style="font-size:1.6rem">${esc(c.kanji || c.kana)}</div>${c.kanji ? `<div class="zh">${esc(c.kana)}</div>` : ""}${c.note ? `<div class="note">${esc(c.note)}</div>` : ""}</div>`;
    } else {
      front = `<div class="face"><div class="ruby">${shown ? esc(ruby) : ""}</div><div class="big">${esc(c.kanji || c.kana)}</div></div>`;
      back = `<div class="answer"><div class="mean">${esc(c.mean)}</div>${c.note ? `<div class="note">${esc(c.note)}</div>` : ""}</div>`;
    }
  } else {
    front = `<div class="face"><div class="ruby">呢個文法點用？</div><div class="big pattern">${esc(c.p)}</div></div>`;
    back = `<div class="answer"><div class="mean">${esc(c.mean)}</div>${c.ex ? `<div class="jp">${esc(c.ex)}</div>` : ""}${c.zh ? `<div class="zh">${esc(c.zh)}</div>` : ""}${c.note ? `<div class="note">${esc(c.note)}</div>` : ""}</div>`;
  }
  return `<div class="card" id="card" role="button" tabindex="0" aria-label="${shown ? "答案" : "撳一下睇答案"}">
    <div class="tag">${tags.join("")}</div>
    ${front}
    ${shown ? back : `<div class="hint">撳張卡（或者空白鍵）睇答案</div>`}
  </div>`;
}

function renderToday() {
  const el = document.getElementById("v-today");
  if (!session) buildSession();
  const s = session;
  updateMeta();
  if (s.i >= s.q.length) {
    const scope = CARDS.filter(inScope);
    const newLeft = scope.filter((c) => !S.c[c.id]).length;
    el.innerHTML = `<div class="done">
      <div class="stamp">済</div>
      <h2>${s.cram ? "練習完" : s.total ? "今日份溫晒喇" : "今日冇卡要溫"}</h2>
      <p class="muted">${s.total ? `頭先溫咗 ${s.done} 次。` : ""}今日總共溫咗 ${S.log[today()] || 0} 次，第1–${S.settings.cur}課仲有 ${newLeft} 張未學嘅卡。</p>
      <div class="row" style="justify-content:center">
        ${newLeft ? `<button class="btn primary" id="more10">再學 10 張新卡</button>` : ""}
        ${s.cram ? `<button class="btn" id="backToday">返去今日溫習</button>` : ""}
        <button class="btn ghost" id="toVocab">揀一課自由練習</button>
      </div></div>`;
    const m = document.getElementById("more10"); if (m) m.onclick = () => extraNew(10);
    const b = document.getElementById("backToday"); if (b) b.onclick = () => { session = null; renderToday(); };
    document.getElementById("toVocab").onclick = () => go("vocab");
    return;
  }
  const c = BYID.get(s.q[s.i]);
  if (!c) { s.i++; return renderToday(); }
  const pct = s.total ? Math.round((Math.min(s.i, s.total) / s.total) * 100) : 0;
  const st = S.c[c.id];
  let gradeHtml = "";
  if (s.shown) {
    if (s.cram) {
      gradeHtml = `<div class="grades two"><button class="g0" data-g="0">唔記得<small>今日再溫</small></button><button class="g2" data-g="2">記得<small>下一張</small></button></div>`;
    } else {
      const labels = ["唔記得", "諗咗好耐", "記得", "好易"];
      gradeHtml = `<div class="grades">${labels.map((l, g) => `<button class="g${g}" data-g="${g}">${l}<small>${fmtIv(schedule(st, g).i)}</small></button>`).join("")}</div>`;
    }
  }
  el.innerHTML = `
    <div class="progress"><span>${esc(s.title || "今日溫習")}</span><div class="bar"><i style="width:${pct}%"></i></div><span>${Math.max(0, s.q.length - s.i)} 張剩</span></div>
    ${cardFace(c, s.shown)}
    ${gradeHtml}
    <div class="row">
      ${canSpeak ? `<button class="btn small" id="say">聽發音</button>` : ""}
      ${s.shown ? `<button class="btn small" id="askBtn">${c.t === "g" ? "用 Claude 練習造句" : "叫 Claude 俾例句"}</button>` : ""}
    </div>
    <div id="aiSlot"></div>`;
  const card = document.getElementById("card");
  const flip = () => { if (!s.shown) { s.shown = true; renderToday(); if (c.t === "v" && S.settings.dir === "zj") speak(c.kana); } };
  card.onclick = flip;
  card.onkeydown = (e) => { if (e.key === "Enter") flip(); };
  el.querySelectorAll(".grades button").forEach((b) => (b.onclick = () => answer(c, +b.dataset.g)));
  const say = document.getElementById("say"); if (say) say.onclick = (e) => { e.stopPropagation(); speak(c.t === "v" ? c.kana : (s.shown ? c.ex || c.p : c.p)); };
  const ask = document.getElementById("askBtn"); if (ask) ask.onclick = () => openAI(c, document.getElementById("aiSlot"));
}

function answer(c, g) {
  const s = session;
  if (s.cram) {
    if (g === 0) { S.c[c.id] = Object.assign({}, schedule(S.c[c.id], 0)); s.q.splice(Math.min(s.q.length, s.i + 4), 0, c.id); }
  } else {
    if (!S.c[c.id]) { S.nt.d = today(); S.nt.n++; }
    S.c[c.id] = schedule(S.c[c.id], g);
    if (g === 0) s.q.splice(Math.min(s.q.length, s.i + 4), 0, c.id);
  }
  S.log[today()] = (S.log[today()] || 0) + 1;
  s.done++; s.i++; s.shown = false;
  save(); renderToday();
}

document.addEventListener("keydown", (e) => {
  if (current !== "today" || !session || /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName)) return;
  if (e.key === " ") { e.preventDefault(); if (!session.shown) { session.shown = true; renderToday(); } }
  const n = { "1": 0, "2": 1, "3": 2, "4": 3 }[e.key];
  if (n != null && session.shown && session.i < session.q.length) {
    const c = BYID.get(session.q[session.i]);
    if (session.cram && n !== 0 && n !== 2) return;
    answer(c, n);
  }
});

/* ===== Claude 練習（sample） ===== */
let samplePromise = null;
const getSample = () => (samplePromise ||= (window.claude && window.claude.use ? window.claude.use("sample") : Promise.resolve(null)));
function openAI(c, slot) {
  const isG = c.t === "g";
  slot.innerHTML = `<div class="ai-box">
    ${isG ? `<label class="muted" for="aiIn">用「${esc(c.p)}」造一句（日文），Claude 幫你改：</label><textarea id="aiIn" placeholder="例：${esc((c.ex || "").split("。")[0])}。"></textarea>` : `<span class="muted">用「${esc(c.kanji || c.kana)}」造兩句簡單例句，只用第${S.settings.cur}課或之前學過嘅文法。</span>`}
    <div class="row"><button class="btn primary small" id="aiGo">${isG ? "幫我改" : "俾例句我"}</button><span class="muted" id="aiState"></span></div>
    <div class="ai-out" id="aiOut"></div></div>`;
  const out = slot.querySelector("#aiOut"), state = slot.querySelector("#aiState"), go = slot.querySelector("#aiGo");
  go.onclick = async () => {
    const sample = await getSample();
    if (!sample) { state.textContent = "呢度用唔到 Claude（要喺 claude.ai 打開）"; return; }
    let prompt;
    const lvl = `學生用緊《みんなの日本語》初級，上到第${S.settings.cur}課。請用廣東話口語（繁體字）解釋，日文例句用漢字＋假名，例句後面用（）附中文意思。唔好用 markdown 標題或粗體，保持簡短。`;
    if (isG) {
      const t = slot.querySelector("#aiIn").value.trim();
      if (!t) { state.textContent = "先寫一句先"; return; }
      prompt = `你係一位耐心嘅日文老師。${lvl}\n文法點（第${c.L}課）：${c.p}（${c.mean}）\n學生造嘅句：「${t}」\n請：1. 一句講啱定錯；2. 如果有錯，寫出改正版本；3. 用兩三句解釋（包括助詞、變化）；4. 再俾一句用同一文法嘅例句。`;
    } else {
      prompt = `你係一位日文老師。${lvl}\n生字（第${c.L}課）：${c.kanji || c.kana}（${c.kana}，${c.mean}）\n請用呢個生字造兩句短例句，只用第${S.settings.cur}課或之前學過嘅文法同生字。每句一行，格式：日文句子（中文意思）。最後加一行小貼士，講呢個字常見錯誤或搭配。`;
    }
    go.disabled = true; state.textContent = "Claude 諗緊…"; out.textContent = "";
    try {
      await sample(prompt, { onText: ({ text }) => { out.textContent = text; state.textContent = ""; }, cache: isG ? false : undefined });
      state.textContent = "";
    } catch (e) {
      const msg = { not_granted: "你未允許呢頁用 Claude", rate_limited: "太密喇，等一陣再試", cancelled: "已停止" }[e && e.code];
      state.textContent = msg || "Claude 暫時答唔到，等陣再試";
    }
    go.disabled = false;
  };
}

/* ===== 生字 ===== */
let vocabL = 16, gramL = 16, vocabQ = "";
function lessonChips(sel, id) {
  let h = `<div class="chips" id="${id}">`;
  for (let L = 1; L <= maxLesson(); L++) h += `<button aria-pressed="${L === sel}" data-l="${L}" class="${L > S.settings.cur ? "future" : ""}">${L}</button>`;
  return h + "</div>";
}
function renderVocab() {
  const el = document.getElementById("v-vocab");
  const q = vocabQ.trim().toLowerCase();
  const items = CARDS.filter((c) => c.t === "v" && (q ? [c.kana, c.kanji, c.mean].join(" ").toLowerCase().includes(q) : c.L === vocabL));
  el.innerHTML = `
    <input type="search" id="vq" placeholder="搵字：假名、漢字或者中文" value="${esc(vocabQ)}" aria-label="搵字">
    ${q ? `<p class="muted">搵到 ${items.length} 個</p>` : lessonChips(vocabL, "vchips")}
    ${q ? "" : `<div class="row" style="justify-content:space-between"><h2>第${vocabL}課 · ${items.length} 個生字</h2><button class="btn primary small" id="cramV">練習呢課</button></div>`}
    <div class="legend"><span><i class="dot"></i>未學</span><span><i class="dot learning"></i>學緊</span><span><i class="dot known"></i>記得</span><span><i class="dot due"></i>今日要溫</span></div>
    <ul class="list">${items.map((c) => `<li><i class="dot ${status(c)}"></i><div class="w">${esc(c.kanji || c.kana)}${c.kanji ? `<small>${esc(c.kana)}</small>` : ""}</div><div class="m">${esc(c.mean)}${c.src ? ` <span class="pill note">老師</span>` : ""}${q ? ` <span class="muted">第${c.L}課</span>` : ""}</div>${canSpeak ? `<button class="icon-btn" data-say="${esc(c.kana)}" aria-label="聽發音">聽</button>` : "<span></span>"}</li>`).join("")}</ul>`;
  const vq = document.getElementById("vq");
  vq.oninput = () => { vocabQ = vq.value; renderVocab(); const n = document.getElementById("vq"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
  el.querySelectorAll("#vchips button").forEach((b) => (b.onclick = () => { vocabL = +b.dataset.l; renderVocab(); }));
  el.querySelectorAll("[data-say]").forEach((b) => (b.onclick = () => speak(b.dataset.say)));
  const cv = document.getElementById("cramV"); if (cv) cv.onclick = () => startCram(vocabL, "v");
}

/* ===== 文法 ===== */
function renderGrammar() {
  const el = document.getElementById("v-grammar");
  const items = CARDS.filter((c) => c.t === "g" && c.L === gramL);
  el.innerHTML = `${lessonChips(gramL, "gchips")}
    <div class="row" style="justify-content:space-between"><h2>第${gramL}課文法</h2><button class="btn primary small" id="cramG">練習呢課文法</button></div>
    ${items.length ? items.map((c, i) => `<article class="gram">
      <h3><span>${esc(c.p)}</span>${c.src ? `<span class="pill note">老師筆記</span>` : `<i class="dot ${status(c)}" title="${status(c)}"></i>`}</h3>
      <div class="mean">${esc(c.mean)}</div>
      ${c.ex ? `<div class="ex"><div class="jp">${esc(c.ex)}</div>${c.zh ? `<div class="zh">${esc(c.zh)}</div>` : ""}</div>` : ""}
      ${c.note ? `<div class="note">${esc(c.note)}</div>` : ""}
      <div class="row">${canSpeak && c.ex ? `<button class="btn small" data-say="${i}">聽例句</button>` : ""}<button class="btn small" data-ai="${i}">用 Claude 練習造句</button></div>
      <div data-slot="${i}"></div>
    </article>`).join("") : `<p class="muted">呢課未有文法卡。你可以喺「設定」加，或者 send 老師筆記俾 Claude。</p>`}`;
  el.querySelectorAll("#gchips button").forEach((b) => (b.onclick = () => { gramL = +b.dataset.l; renderGrammar(); }));

/* ===== 進度 ===== */
function streak() {
  let n = 0, t = today();
  if (!S.log[t]) t--;
  while (S.log[t]) { n++; t--; }
  return n;
}
function renderStats() {
  const el = document.getElementById("v-stats");
  const scope = CARDS.filter(inScope);
  const counts = { new: 0, learning: 0, known: 0, due: 0 };
  scope.forEach((c) => counts[status(c)]++);
  const t = today();
  let week = "";
  for (let d = t - 13; d <= t; d++) { const n = S.log[d] || 0; week += `<i class="${n >= 20 ? "on2" : n ? "on1" : ""} ${d === t ? "today" : ""}" title="${n} 次"></i>`; }
  let rows = "";
  for (let L = 1; L <= maxLesson(); L++) {
    const cs = CARDS.filter((c) => c.L === L && (c.t === "v" || S.settings.gram));
    if (!cs.length) continue;
    const k = cs.filter((c) => status(c) === "known").length;
    const l = cs.filter((c) => ["learning", "due"].includes(status(c))).length;
    rows += `<div class="lrow"><span>第${L}課</span><div class="stack" title="記得 ${k}／學緊 ${l}／共 ${cs.length}"><i class="k" style="width:${(k / cs.length) * 100}%"></i><i class="l" style="width:${(l / cs.length) * 100}%"></i></div><span class="muted">${k + l}/${cs.length}</span></div>`;
  }
  el.innerHTML = `
    <div class="tiles">
      <div class="tile"><b>${counts.due}</b><span>今日要溫</span></div>
      <div class="tile"><b>${S.log[t] || 0}</b><span>今日溫咗</span></div>
      <div class="tile"><b>${streak()}</b><span>連續日數</span></div>
      <div class="tile"><b>${counts.known}</b><span>記得（7日以上）</span></div>
    </div>
    <h2>最近兩個星期</h2>
    <div class="week">${week}</div>
    <h2>每課進度</h2>
    <div class="legend"><span><i class="dot known"></i>記得</span><span><i class="dot learning"></i>學緊</span><span><i class="dot"></i>未學</span></div>
    <div class="lessons">${rows}</div>
    <p class="muted">一星期一堂嘅話，每日溫 10 分鐘最有效：舊卡會喺你就嚟唔記得嘅時候再出現，記得越牢就隔得越耐。</p>`;
}

        <select id="sDir"><option value="jz" ${st.dir === "jz" ? "selected" : ""}>睇日文 → 諗意思</option><option value="zj" ${st.dir === "zj" ? "selected" : ""}>睇中文 → 諗日文（較難）</option></select>
      </label>
      <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="sGram" ${st.gram ? "checked" : ""}> 每日溫習包括文法卡</label>
      <p class="muted">每次上完堂，記得將「而家上到」改成新嗰課，新課嘅卡就會開始出現。</p>
    </form>
    <form class="form" id="addForm">
      <h2>加卡（老師筆記）</h2>
      <div class="two">
        <label for="aType">類型<select id="aType"><option value="v">生字</option><option value="g">文法</option></select></label>
        <label for="aL">第幾課<input type="number" id="aL" min="1" max="50" value="${st.cur}"></label>
      </div>
      <div class="two">
        <label for="aJp"><span id="aJpLbl">日文（漢字）</span><input type="text" id="aJp" placeholder="例：曲がります"></label>
        <label for="aKana"><span id="aKanaLbl">讀音（假名）</span><input type="text" id="aKana" placeholder="例：まがります"></label>
      </div>
      <label for="aMean">意思<input type="text" id="aMean" placeholder="例：轉（彎）"></label>
      <label for="aNote">例句／補充（可以唔填）<textarea id="aNote" placeholder="例：信号を右へ曲がってください。"></textarea></label>
      <div class="row"><button class="btn primary" type="submit">加入</button><span class="muted" id="addState"></span></div>
    </form>
    <div class="form">
      <h2>重設</h2>
      <p class="muted">清除所有溫習紀錄，由頭開始。老師筆記唔會刪除。</p>
      <div class="row" id="resetRow"><button class="btn danger" id="reset">清除進度</button></div>
      <p class="muted" id="syncNote"></p>
    </div>`;
  const upd = () => {
    st.cur = +document.getElementById("sCur").value;
    st.newPerDay = Math.max(0, Math.min(100, +document.getElementById("sNew").value || 0));
    st.dir = document.getElementById("sDir").value;
    st.gram = document.getElementById("sGram").checked;
    session = null; save(); updateMeta();
  };
  el.querySelectorAll("#setForm select, #setForm input").forEach((i) => (i.onchange = upd));
  document.getElementById("setForm").onsubmit = (e) => e.preventDefault();
  const aType = document.getElementById("aType");
  aType.onchange = () => {
    const g = aType.value === "g";
    document.getElementById("aJpLbl").textContent = g ? "句型" : "日文（漢字）";
    document.getElementById("aKanaLbl").textContent = g ? "例句（日文）" : "讀音（假名）";
  };
  document.getElementById("addForm").onsubmit = async (e) => {
    e.preventDefault();
    const stEl = document.getElementById("addState");
    const g = aType.value === "g";
    const L = +document.getElementById("aL").value || st.cur;
    const jp = document.getElementById("aJp").value.trim(), kana = document.getElementById("aKana").value.trim();
    const mean = document.getElementById("aMean").value.trim(), note = document.getElementById("aNote").value.trim();
    if (!(jp || kana) || !mean) { stEl.textContent = "要填日文同意思"; return; }
    const doc = g ? { t: "g", L, p: jp || kana, ex: g ? kana : "", mean, note, src: "page" }
                  : { t: "v", L, kanji: kana ? jp : "", kana: kana || jp, mean, note, src: "page" };
    if (!db) { stEl.textContent = "要喺 claude.ai 打開先可以儲存老師筆記"; return; }
    try { await db.collection("cards").add(doc); stEl.textContent = "已加入第" + L + "課"; e.target.reset(); document.getElementById("aL").value = st.cur; }
    catch (err) { stEl.textContent = err && err.code === "invalid_argument" ? "你冇權限加卡" : "加唔到，等陣再試"; }
  };
  document.getElementById("reset").onclick = () => {
    const row = document.getElementById("resetRow");
    row.innerHTML = `<span>真係清除晒？</span><button class="btn danger" id="resetYes">確定清除</button><button class="btn" id="resetNo">取消</button>`;
    document.getElementById("resetNo").onclick = renderSetup;
    document.getElementById("resetYes").onclick = () => { const keep = S.settings; S = freshState(); S.settings = keep; session = null; save(); toast("已清除進度"); renderSetup(); };
  };
  document.getElementById("syncNote").textContent = stateRef ? "進度已同步到你嘅 Claude 帳戶，手機同電腦都睇到。" : "進度暫時只存喺呢個瀏覽器。";
}

/* ===== 導航 ===== */
let current = "today";
const RENDER = { today: renderToday, vocab: renderVocab, grammar: renderGrammar, stats: renderStats, setup: renderSetup };
function go(v) {
  current = v;
  document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-selected", b.dataset.v === v));
  for (const k of Object.keys(RENDER)) document.getElementById("v-" + k).hidden = k !== v;
  RENDER[v]();
  window.scrollTo(0, 0);
}
document.querySelectorAll("#tabs button").forEach((b) => (b.onclick = () => go(b.dataset.v)));
function updateMeta() {
  const due = CARDS.filter((c) => inScope(c) && S.c[c.id] && S.c[c.id].d <= today()).length;
  document.getElementById("meta").textContent = `第1–${S.settings.cur}課 · ${due} 張到期`;
}
let toastT;
function toast(m) { const t = document.getElementById("toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 2400); }

vocabL = gramL = S.settings.cur;
const start = /^(today|vocab|grammar|stats|setup)$/.test(location.hash.slice(1)) ? location.hash.slice(1) : "today";
go(start);

/* ===== 雲端同步（db + user） ===== */
(async () => {
  if (!window.claude || !window.claude.use) return;
  const [d, u] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
  user = u;
  if (!d) return;
  db = d;
  d.collection("cards").onSnapshot((snap) => {
    custom = snap.docs.map((doc) => {
      const x = doc.data() || {};
      return { id: "c:" + doc.id, t: x.t === "g" ? "g" : "v", L: +x.L || 1, kana: x.kana || "", kanji: x.kanji || "", p: x.p || "", mean: x.mean || "", ex: x.ex || "", zh: x.zh || "", note: x.note || "", src: x.src || "teacher" };
    }).filter((c) => (c.t === "v" ? c.kana || c.kanji : c.p) && c.mean);
    rebuildCards();
    if (current !== "today" || !session || session.i >= session.q.length) { if (current === "today") session = null; RENDER[current](); }
    updateMeta();
  }, () => {});
  const uid = u ? await u.id() : null;
  if (!uid) return;
  stateRef = d.doc("data/users/" + uid + "/state");
  try {
    const snap = await stateRef.get();
    const remote = snap.exists ? normalize(JSON.parse(JSON.stringify(snap.data()))) : null;
    if (remote && remote.upd > (S.upd || 0)) {
      S = remote;
      try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
      session = null; RENDER[current]();
    } else if (S.upd > 0) {
      saveRemote();
    }
  } catch (e) {}
  if (current === "setup") renderSetup();
})();
</script>
