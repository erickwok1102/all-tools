<title>みんなの復習帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Klee+One:wght@400;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
/* Layout: one narrow study column; a genkō-yōshi (原稿用紙) card is the hero, tabs sit in a sticky header. */
:root {
  --paper: #eef1f4;
  --sheet: #fbfcfd;
  --ink: #1a2232;
  --ink-soft: #5b6578;
  --rule: #d5dbe4;
  --grid: #dfe6ef;
  --ai: #2c4a8c;        /* 藍 indigo: primary accent */
  --ai-wash: #e3e9f6;
  --shu: #c8432c;       /* 朱 vermilion: forgot */
  --yamabuki: #b9800f;  /* 山吹 amber: hard */
  --matcha: #3b7f4f;    /* 抹茶 green: easy / learned */
  --font-jp: "Klee One", "Hiragino Mincho ProN", "Yu Mincho", serif;
  --font-ui: "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, sans-serif;
  --step--1: 0.8125rem;
  --step-0: 0.9375rem;
  --step-1: 1.125rem;
  --step-2: 1.5rem;
  --step-4: 2.75rem;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #11151d; --sheet: #181e29; --ink: #e5e9f1; --ink-soft: #9aa4b6;
    --rule: #2b3444; --grid: #222b39; --ai: #8ea9ec; --ai-wash: #1f2a42;
    --shu: #ec7a63; --yamabuki: #e0ae4a; --matcha: #73c08a; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #11151d; --sheet: #181e29; --ink: #e5e9f1; --ink-soft: #9aa4b6;
  --rule: #2b3444; --grid: #222b39; --ai: #8ea9ec; --ai-wash: #1f2a42;
  --shu: #ec7a63; --yamabuki: #e0ae4a; --matcha: #73c08a; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--paper); color: var(--ink);
  font-family: var(--font-ui); font-size: var(--step-0); line-height: 1.6;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); }
.wrap {
  max-width: 600px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 48px;
}
header {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--paper); padding-block: 14px 0;
  display: grid; gap: 10px; border-bottom: 1px solid var(--rule);
}
.brand { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.brand h1 { margin: 0; font-family: var(--font-jp); font-weight: 600; font-size: var(--step-2); letter-spacing: 0.04em; text-wrap: balance; }
.brand .meta { color: var(--ink-soft); font-size: var(--step--1); font-variant-numeric: tabular-nums; }
nav { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: none; }
nav button {
  border: 0; background: none; color: var(--ink-soft); font: inherit; font-weight: 500;
  padding: 8px 10px 10px; border-bottom: 2px solid transparent; cursor: pointer; white-space: nowrap;
}
nav button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--ai); }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 2px solid var(--ai); outline-offset: 2px; }
main { padding-top: 18px; display: grid; gap: 18px; }
section[hidden] { display: none; }
.view { display: grid; gap: 16px; }
.view > *, .status > *, .daily > * { min-width: 0; }

/* Study card */
.progress { display: flex; align-items: center; gap: 10px; font-size: var(--step--1); color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.bar { flex: 1; height: 4px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--ai); width: 0; transition: width .25s; }
.card {
  background-color: var(--sheet);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 28px 28px; background-position: -1px -1px;
  border: 1px solid var(--rule); border-radius: 6px;
  min-height: 300px; padding: 22px 20px; display: grid; align-content: space-between; gap: 18px;
  cursor: pointer; user-select: none;
}
.card .tag { display: flex; gap: 8px; align-items: center; font-size: var(--step--1); color: var(--ink-soft); }
.pill { display: inline-block; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--rule); background: var(--sheet); font-size: 0.75rem; letter-spacing: 0.04em; }
.pill.new { color: var(--ai); border-color: var(--ai); }
.pill.lapse { color: var(--shu); border-color: var(--shu); }
.pill.note { color: var(--matcha); border-color: var(--matcha); }
.face { text-align: center; display: grid; gap: 6px; justify-items: center; }
.face .ruby { font-family: var(--font-jp); font-size: var(--step-1); color: var(--ink-soft); min-height: 1.6em; }
.face .big { font-family: var(--font-jp); font-size: var(--step-4); line-height: 1.25; font-weight: 600; word-break: keep-all; overflow-wrap: anywhere; background: var(--sheet); padding: 0 8px; }
.face .big.zh { font-family: var(--font-ui); font-size: 2rem; font-weight: 700; }
.face .big.pattern { font-size: 2rem; }
.answer { border-top: 1px dashed var(--rule); padding-top: 14px; display: grid; gap: 8px; text-align: left; background: var(--sheet); }
.answer .mean { font-size: var(--step-1); font-weight: 500; white-space: pre-line; }
.answer .jp { font-family: var(--font-jp); font-size: var(--step-1); white-space: pre-line; }
.answer .zh { color: var(--ink-soft); white-space: pre-line; }
.answer .note { font-size: var(--step--1); color: var(--ink-soft); white-space: pre-line; }
.hint { text-align: center; color: var(--ink-soft); font-size: var(--step--1); background: var(--sheet); justify-self: center; padding: 0 6px; }
.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.grades.two { grid-template-columns: repeat(2, 1fr); }
.grades button {
  font: inherit; font-weight: 700; padding: 10px 4px 8px; border-radius: 6px; cursor: pointer;
  border: 1px solid currentColor; background: var(--sheet); display: grid; gap: 0; line-height: 1.3;
}
.grades button small { font-weight: 400; font-size: 0.75rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.g0 { color: var(--shu); } .g1 { color: var(--yamabuki); } .g2 { color: var(--ai); } .g3 { color: var(--matcha); }
.row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.btn {
  font: inherit; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink);
  padding: 7px 14px; border-radius: 6px; cursor: pointer;
}
.btn.primary { background: var(--ai); border-color: var(--ai); color: var(--sheet); font-weight: 700; }
.btn.ghost { background: none; }
.btn.small { padding: 4px 10px; font-size: var(--step--1); }
.btn.danger { color: var(--shu); border-color: var(--shu); }
.done { text-align: center; padding: 36px 16px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; display: grid; gap: 12px; justify-items: center; }
.done .stamp {
  font-family: var(--font-jp); font-weight: 600; font-size: 1.6rem; color: var(--shu);
  border: 3px solid var(--shu); border-radius: 50%; width: 92px; height: 92px; display: grid; place-items: center; transform: rotate(-8deg);
}
.ai-box { border: 1px solid var(--rule); border-radius: 6px; padding: 12px; display: grid; gap: 8px; background: var(--sheet); cursor: auto; user-select: text; }
.ai-box textarea, .ai-box input { width: 100%; }
.ai-out { white-space: pre-wrap; font-size: var(--step-0); line-height: 1.7; }
.ai-out:empty { display: none; }

/* Practice */
.modes { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.mode { font: inherit; text-align: left; display: grid; gap: 2px; padding: 12px 14px; border-radius: 6px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); cursor: pointer; }
.mode span { font-size: var(--step--1); color: var(--ink-soft); }
.mode[aria-pressed="true"] { border-color: var(--ai); box-shadow: inset 0 0 0 1px var(--ai); }
.mode[aria-pressed="true"] b { color: var(--ai); }
.card.practice { min-height: 200px; cursor: auto; align-content: center; }
.blank { color: var(--ai); font-weight: 700; }
.opts { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.opt { font-family: var(--font-jp); font-size: 1.3rem; font-weight: 600; padding: 14px 8px; border-radius: 6px; border: 1px solid var(--rule); background: var(--sheet); color: var(--ink); cursor: pointer; overflow-wrap: anywhere; }
.opt:hover:not(:disabled) { border-color: var(--ai); }
.opt:disabled { cursor: default; opacity: 0.6; }
.opt.right { border-color: var(--matcha); color: var(--matcha); opacity: 1; box-shadow: inset 0 0 0 1px var(--matcha); }
.opt.wrong { border-color: var(--shu); color: var(--shu); opacity: 1; text-decoration: line-through; }
.verdict { border: 1px solid var(--rule); border-radius: 6px; padding: 12px 14px; border-top-width: 3px; }
.verdict.ok { border-top-color: var(--matcha); } .verdict.ok > b { color: var(--matcha); }
.verdict.ng { border-top-color: var(--shu); } .verdict.ng > b { color: var(--shu); }
.pad {
  width: 100%; height: 240px; touch-action: none; border: 1px solid var(--rule); border-radius: 6px; cursor: crosshair;
  background-color: var(--sheet);
  background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 40px 40px;
}

/* Memory & analysis */
.memos { display: grid; gap: 6px; margin-top: 4px; }
.memo { display: grid; grid-template-columns: auto auto minmax(0, 1fr); gap: 10px; align-items: center; padding: 8px 12px; border-radius: 6px; background: var(--ai-wash); }
.memo-k { font-family: var(--font-jp); font-size: 1.9rem; font-weight: 600; line-height: 1; }
.memo-e { font-size: 1.7rem; line-height: 1; }
.memo-t { display: grid; font-size: var(--step-0); line-height: 1.4; }
.memo-t b { font-size: var(--step--1); color: var(--ink-soft); font-weight: 500; }
details.note summary, details.recent summary { cursor: pointer; color: var(--ai); }
.weaks { display: grid; }
.weak { display: grid; gap: 6px; padding: 12px 0; border-bottom: 1px solid var(--rule); }
.weak .top { display: flex; justify-content: space-between; gap: 8px; align-items: baseline; }
.weak .tip { font-size: var(--step--1); color: var(--ink-soft); }
.meter { height: 8px; background: var(--rule); border-radius: 4px; overflow: hidden; }
.meter i { display: block; height: 100%; }
.spark { width: 100%; height: 56px; background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; }
.big-btn { width: 100%; padding: 16px; font-size: var(--step-1); }
.mode-weak { border-color: var(--ai); }
body.big { --step--1: 0.9375rem; --step-0: 1.0625rem; --step-1: 1.3rem; --step-2: 1.7rem; --step-4: 3.4rem; }
body.big .opt { font-size: 1.6rem; }

.level-card { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; padding: 16px; border: 1px solid var(--rule); border-radius: 6px; background: var(--sheet); }
.level { display: grid; gap: 2px; }
.level b { font-size: var(--step-2); color: var(--ai); line-height: 1.2; }
.done .level { justify-items: center; }
.memory { font-size: var(--step--1); color: var(--ink-soft); margin: 0; }
.table-wrap { overflow-x: auto; }
.ability { width: 100%; border-collapse: collapse; font-size: var(--step-0); }
.ability th, .ability td { padding: 8px 6px; border-bottom: 1px solid var(--rule); text-align: left; vertical-align: middle; white-space: nowrap; }
.ability thead th { font-size: var(--step--1); color: var(--ink-soft); font-weight: 500; }
.ability th small { display: block; font-weight: 400; color: var(--ink-soft); font-size: 0.75rem; }
.ability .bar-cell { width: 35%; min-width: 60px; }
.ability .num { text-align: right; font-variant-numeric: tabular-nums; }
.grade { font-weight: 700; font-size: var(--step--1); white-space: nowrap; }
.up { color: var(--matcha); } .down { color: var(--shu); }
.lrow { grid-template-columns: 48px minmax(0, 1fr) 56px; }
.zh-opts .opt { font-family: var(--font-ui); font-size: var(--step-1); }
.test-res { justify-content: center; }

/* Game */
.game-font { font-family: "DotGothic16", var(--font-ui); letter-spacing: 0.02em; }
.hud-lv { color: var(--ai); font-weight: 700; }
.combo { color: var(--shu); font-size: var(--step--1); }
.lvup { position: fixed; left: 50%; top: 40%; transform: translate(-50%, -50%); z-index: 30; display: grid; justify-items: center; gap: 4px;
  padding: 18px 28px; border-radius: 8px; background: var(--ink); color: var(--paper); box-shadow: 0 10px 40px rgba(0,0,0,.25); animation: pop .5s ease-out; }
.lvup b { font-size: 2rem; color: var(--yamabuki); white-space: nowrap; }
.lvup span { white-space: nowrap; }
@keyframes pop { from { transform: translate(-50%, -50%) scale(.6); opacity: 0; } to { transform: translate(-50%, -50%) scale(1); opacity: 1; } }
.status { border: 2px solid var(--ink); border-radius: 8px; padding: 14px 16px; background: var(--sheet); display: grid; gap: 8px; box-shadow: 4px 4px 0 var(--ai-wash); }
.status-top { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.status-lv { font-size: 1.8rem; color: var(--ai); }
.status-title { font-weight: 700; }
.xpbar { height: 10px; border: 1px solid var(--ink); border-radius: 2px; overflow: hidden; background: var(--paper); }
.xpbar i { display: block; height: 100%; background: var(--yamabuki); }
.radar { width: 100%; max-width: 320px; justify-self: center; overflow: visible; }
.r-ring { fill: none; stroke: var(--rule); stroke-width: 1; }
.r-axis { stroke: var(--rule); stroke-width: 1; }
.r-val { fill: color-mix(in srgb, var(--ai) 28%, transparent); stroke: var(--ai); stroke-width: 2; stroke-linejoin: round; }
.r-lab { fill: var(--ink); font-size: 12px; font-family: var(--font-ui); font-weight: 600; }
.r-rank { fill: var(--shu); font-family: "DotGothic16", var(--font-ui); }
.stat-grid { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.stat-grid div { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 6px; padding: 6px 8px; border: 1px solid var(--rule); border-radius: 4px; }
.stat-grid span { font-size: var(--step--1); color: var(--ink-soft); }
.stat-grid b { font-size: 1.15rem; font-variant-numeric: tabular-nums; }
.stat-grid small { grid-column: 1 / -1; font-size: 0.7rem; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.rank { font-style: normal; font-family: "DotGothic16", var(--font-ui); font-weight: 700; width: 1.4em; text-align: center; border-radius: 3px; color: var(--sheet); background: var(--ink-soft); }
.r-S { background: var(--shu); } .r-A { background: var(--yamabuki); } .r-B { background: var(--matcha); } .r-C { background: var(--ai); }
.status-foot { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.badges { font-size: 1.4rem; letter-spacing: 4px; }
.badges .dim { filter: grayscale(1); opacity: .35; }
.level-card.game { border: 2px solid var(--ink); }
.boss-map { display: grid; gap: 10px; position: relative; }
.boss-node { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 12px 14px; border: 2px solid var(--ink); border-radius: 8px; background: var(--sheet); }
.boss-node.cleared { border-color: var(--matcha); }
.boss-node.locked { opacity: .55; border-style: dashed; }
.boss-emoji { font-size: 2.4rem; line-height: 1; }
.boss-info { display: grid; gap: 2px; font-size: var(--step--1); }
.boss-info b { font-size: var(--step-1); }
.arena { border: 2px solid var(--ink); border-radius: 8px; padding: 12px 14px; background: var(--sheet); display: grid; gap: 6px; }
.boss-head { display: flex; justify-content: space-between; align-items: baseline; }
.hp { height: 12px; border: 1px solid var(--ink); border-radius: 2px; overflow: hidden; background: var(--paper); }
.hp i { display: block; height: 100%; background: var(--shu); transition: width .3s; }
.boss-big { font-size: 4.5rem; text-align: center; line-height: 1.2; position: relative; }
.dmg { position: absolute; left: 58%; top: 0; font-size: 1.6rem; color: var(--shu); animation: rise .8s ease-out forwards; }
@keyframes rise { from { transform: translateY(10px); opacity: 1; } to { transform: translateY(-24px); opacity: 0; } }
.arena.hit .boss-big { animation: shake .35s; }
.arena.hurt { animation: flash .4s; }
@keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
@keyframes flash { 0% { background: color-mix(in srgb, var(--shu) 35%, var(--sheet)); } 100% { background: var(--sheet); } }
.hearts { display: flex; gap: 4px; align-items: center; color: var(--shu); font-size: 1.3rem; }
.hearts .lost { color: var(--rule); }
.hearts .combo { margin-left: auto; }

/* Streak & rewards */
.daily { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 14px; align-items: center; padding: 12px 14px; border: 2px solid var(--ink); border-radius: 8px; background: var(--sheet); }
.ring { --p: 0; width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; background: conic-gradient(var(--matcha) calc(var(--p) * 1%), var(--rule) 0); }
.ring span { width: 50px; height: 50px; border-radius: 50%; display: grid; place-items: center; background: var(--sheet); font-size: 0.9rem; }
.daily-txt { display: grid; gap: 2px; font-size: var(--step--1); min-width: 0; }
.daily-txt b { font-size: var(--step-1); }
.warn { color: var(--shu); }
.delta { font-size: var(--step--1); font-weight: 700; margin-left: 6px; }
.delta.up { color: var(--matcha); } .delta.down { color: var(--shu); }
.celebrate { position: fixed; inset: 0; z-index: 40; display: grid; place-items: center; background: rgba(0, 0, 0, .45);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.cele-box { display: grid; justify-items: center; gap: 8px; text-align: center; padding: 22px 26px; border-radius: 10px; background: var(--sheet); border: 2px solid var(--ink); max-width: 340px; animation: pop2 .45s ease-out; }
.cele-box > b { font-size: 1.5rem; color: var(--ai); }
.big-fire { font-size: 2.6rem; font-family: "DotGothic16", var(--font-ui); line-height: 1.1; }
.chest { font-weight: 700; color: var(--yamabuki); }
@keyframes pop2 { from { transform: scale(.7); opacity: 0; } to { transform: scale(1); opacity: 1; } }
.ach-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.ach { display: grid; justify-items: center; text-align: center; gap: 2px; padding: 8px 4px; border: 1px solid var(--rule); border-radius: 6px; background: var(--sheet); }
.ach span { font-size: 1.6rem; line-height: 1.2; }
.ach b { font-size: var(--step--1); }
.ach small { font-size: 0.7rem; color: var(--ink-soft); }
.ach.locked { opacity: .45; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal i { aspect-ratio: 1; border-radius: 4px; background: var(--rule); display: grid; place-items: center; font-style: normal; font-size: .7rem; max-width: 100%; }
.cal i.met, .cal-key.met { background: var(--matcha); }
.cal i.part, .cal-key.part { background: color-mix(in srgb, var(--matcha) 40%, var(--rule)); }
.cal i.frozen { background: var(--ai-wash); }
.cal i.today { outline: 2px solid var(--ink); }
.cal-key { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }

/* Lists */
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button {
  font: inherit; font-variant-numeric: tabular-nums; min-width: 40px; padding: 4px 10px; border-radius: 999px;
  border: 1px solid var(--rule); background: var(--sheet); color: var(--ink-soft); cursor: pointer;
}
.chips button[aria-pressed="true"] { background: var(--ai); color: var(--sheet); border-color: var(--ai); }
.chips button.future { opacity: 0.55; }
input[type="search"], input[type="text"], input[type="number"], select, textarea {
  font: inherit; color: var(--ink); background: var(--sheet); border: 1px solid var(--rule); border-radius: 6px; padding: 8px 10px;
}
textarea { resize: vertical; min-height: 64px; }
.list { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--rule); }
.list li { display: grid; grid-template-columns: 10px minmax(0, 1fr) minmax(0, 1fr) auto; gap: 12px; align-items: center; padding: 10px 2px; border-bottom: 1px solid var(--rule); }
.list .w { font-family: var(--font-jp); font-size: var(--step-1); line-height: 1.3; min-width: 0; }
.list .w small { display: block; font-size: var(--step--1); color: var(--ink-soft); }
.list .m { min-width: 0; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--rule); }
.dot.learning { background: var(--yamabuki); }
.dot.known { background: var(--matcha); }
.dot.due { background: var(--shu); }

function schedule(st, g) {
  st = Object.assign({ i: 0, e: 2.5, r: 0, l: 0 }, st);
  if (g === 0) { st.l++; st.r = 0; st.i = 0; st.e = Math.max(1.3, st.e - 0.2); }
  else if (g === 1) { st.i = st.r === 0 ? 1 : Math.max(st.i + 1, Math.round(st.i * 1.2)); st.e = Math.max(1.3, st.e - 0.15); st.r++; }
  else if (g === 2) { st.i = st.r === 0 ? 1 : st.r === 1 ? 3 : Math.max(st.i + 1, Math.round(st.i * st.e)); st.r++; }
  else { st.i = st.r === 0 ? 3 : st.r === 1 ? 6 : Math.max(st.i + 2, Math.round(st.i * st.e * 1.3)); st.e += 0.15; st.r++; }
  st.d = today() + st.i; st.s = today();
  return st;
}

  const due = scope.filter((c) => S.c[c.id] && S.c[c.id].d <= t).sort((a, b) => S.c[a.id].d - S.c[b.id].d);
  const left = Math.max(0, S.settings.newPerDay - S.nt.n);
  const fresh = scope.filter((c) => !S.c[c.id]).sort(newOrder).slice(0, left);
  // 新卡穿插喺舊卡之間
  const q = []; let ni = 0;
  due.forEach((c, i) => { q.push(c.id); if (i % 3 === 2 && ni < fresh.length) q.push(fresh[ni++].id); });
  while (ni < fresh.length) q.push(fresh[ni++].id);
  session = { q, i: 0, shown: false, cram: false, done: 0, total: q.length, title: "" };
}
function startCram(L, type) {
  const ids = CARDS.filter((c) => c.L === L && (!type || c.t === type)).map((c) => c.id);
  for (let i = ids.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [ids[i], ids[j]] = [ids[j], ids[i]]; }
  session = { q: ids, i: 0, shown: false, cram: true, done: 0, total: ids.length, title: "第" + L + "課 自由練習" };
  go("today");
}
function extraNew(n) {
  const fresh = CARDS.filter((c) => inScope(c) && !S.c[c.id]).sort(newOrder).slice(0, n);
  session = { q: fresh.map((c) => c.id), i: 0, shown: false, cram: false, done: 0, total: fresh.length, title: "加多 " + fresh.length + " 張新卡" };
  renderToday();
}

function answer(c, g) {
  const s = session;
  if (s.cram) {
    if (g === 0) { S.c[c.id] = Object.assign({}, schedule(S.c[c.id], 0)); s.q.splice(Math.min(s.q.length, s.i + 4), 0, c.id); }
  } else {
    if (!S.c[c.id]) { S.nt.d = today(); S.nt.n++; }
    S.c[c.id] = schedule(S.c[c.id], g);
    if (g === 0) s.q.splice(Math.min(s.q.length, s.i + 4), 0, c.id);
  }
  tick();
  rec(["srs:" + c.t, "L" + c.L], g >= 2);
  if (g === 0) toast(c.t === "v" ? "▼ 語彙（記返就升返）" : "▼ 文法（記返就升返）");
  addXP(g >= 2 ? 2 : 1);
  if (c.t === "v" && c.kanji) bumpKanji(c.kanji, g >= 2);
  checkAch();
  if (g === 0) logWrong("srs", jpOf(c), c.mean);
  s.done++; s.i++; s.shown = false;
  save(); renderToday();
}

document.addEventListener("keydown", (e) => {

  { id: "test", name: "程度測驗", desc: "約 20 題，估你而家程度" },

const modeName = (id) => (MODES.find((m) => m.id === id) || {}).name || "";
const FORM_NAME = { te: "て形", nai: "ない形", dict: "辞書形" };
let P = { mode: "weak", range: 0, typing: false, run: null };
const clean = (s) => String(s || "").replace(/\[.*?\]|［.*?］/g, "").replace(/（.*?）|\(.*?\)/g, "").replace(/[ 　]/g, "");
const hasKanji = (s) => /[一-鿿]/.test(s);
const shuffle = (a) => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const pickN = (a, n) => shuffle(a).slice(0, n);
const inRange = (c) => (P.all ? true : P.range ? c.L === P.range : c.L <= S.settings.cur);

function kanjiPool() {
  const seen = new Set(), out = [];
  CARDS.forEach((c) => {
    if (c.t !== "v" || !inRange(c)) return;
    const k = clean(c.kanji), r = clean(c.kana);
    if (!k || !hasKanji(k) || k === r || /[～、。？]/.test(k) || seen.has(k)) return;
    seen.add(k); out.push({ card: c, k, r });

// 近似讀音：濁音、長音、促音
const DAKU = "かがきぎくぐけげこごさざしじすずせぜそぞただちぢつづてでとどはばひびふぶへべほぼ";
function variant(r) {
  const tries = [];
  [...r].forEach((ch, i) => {
    const j = DAKU.indexOf(ch);
    if (j >= 0) tries.push(r.slice(0, i) + DAKU[j % 2 ? j - 1 : j + 1] + r.slice(i + 1));
  });
  if (/[ょゅ]う/.test(r)) tries.push(r.replace(/([ょゅ])う/, "$1"));
  else if (/[ょゅ]/.test(r)) tries.push(r.replace(/([ょゅ])/, "$1う"));
  if (r.includes("っ")) tries.push(r.replace("っ", ""));
  const ok = tries.filter((x) => x !== r);
  return ok.length ? ok[Math.floor(Math.random() * ok.length)] : null;
}

// 動詞變化
const DAN = { い: "わいうえお", き: "かきくけこ", ぎ: "がぎぐげご", し: "さしすせそ", ち: "たちつてと", に: "なにぬねの", び: "ばびぶべぼ", み: "まみむめも", り: "らりるれろ" };
const TE_END = { い: "って", ち: "って", り: "って", み: "んで", び: "んで", に: "んで", き: "いて", ぎ: "いで", し: "して" };
const E_DAN = "えけげせぜてでねへべめれ";
const II_KANJI = ["見ます", "起きます", "浴びます", "着ます", "降ります", "借ります", "足ります", "出来ます", "居ます"];
function verbGroup(rs, ks) {
  if (ks.endsWith("来") && rs.endsWith("き")) return 3;
  if (rs.endsWith("し") && ks.endsWith("し")) {
    const pre = ks.slice(0, -1);
    if (!pre) return 3;
    return /[ぁ-ん]$/.test(pre) || /出$/.test(pre) || /^[一-鿿]$/.test(pre) ? 1 : 3;
  }
  if (II_KANJI.some((x) => (ks + "ます").endsWith(x)) || (ks === rs && ["い", "でき"].includes(rs))) return 2;
  return E_DAN.includes(rs.slice(-1)) ? 2 : 1;
}
function conj(rs, ks, g, form) {
  if (g === 3) {
    const p = rs.slice(0, -1), pk = ks.slice(0, -1);
    if (ks.endsWith("来")) return { te: [p + "きて", pk + "来て"], nai: [p + "こない", pk + "来ない"], dict: [p + "くる", pk + "来る"] }[form];
    return { te: [p + "して", pk + "して"], nai: [p + "しない", pk + "しない"], dict: [p + "する", pk + "する"] }[form];
  }
  if (g === 2) { const e = { te: "て", nai: "ない", dict: "る" }[form]; return [rs + e, ks + e]; }
  const last = rs.slice(-1);
  if (!DAN[last] || ks.slice(-1) !== last) return null;
  const end = form === "te" ? (last === "き" && ks.endsWith("行き") ? "って" : TE_END[last]) : form === "nai" ? DAN[last][0] + "ない" : DAN[last][2];
  return [rs.slice(0, -1) + end, ks.slice(0, -1) + end];
}
function verbInfo(c) {
  if (c.t !== "v") return null;
  const r = clean(c.kana), k = clean(c.kanji) || r;
  if (!r.endsWith("ます") || !k.endsWith("ます") || r.includes("～") || ["あります", "いらっしゃいます"].includes(r)) return null;
  // 固定講法唔出題
  if (/(ねがいします|ございます|ています|ってきます|になります|しつれいします|いただきます)$/.test(r) && !k.includes("来")) return null;
  const rs = r.slice(0, -2), ks = k.slice(0, -2), g = verbGroup(rs, ks);
  return conj(rs, ks, g, "te") ? { card: c, rs, ks, g } : null;
}
function wrongForms(v, form) {
  const out = [];
  [1, 2, 3].forEach((g) => { if (g !== v.g) { const f = conj(v.rs, v.ks, g, form); if (f) out.push(f[1]); } });
  const b = v.ks.slice(0, -1);
  if (form === "te") ["って", "んで", "いて", "いで", "して"].forEach((e) => out.push(b + e));
  if (form === "nai") out.push(v.ks + "ない", b + "あない");
  if (form === "dict") out.push(v.ks + "る", b + "う");
  return out;
}

// 助詞填空
const PARTS = ["までに", "から", "まで", "を", "に", "で", "へ", "が", "は", "と", "も", "や", "の"];
const PCHOICE = ["は", "が", "を", "に", "で", "へ", "と", "も", "から", "まで"];
const HIRA_NOUN = /(ここ|そこ|あそこ|どこ|わたし|あなた|だれ|うち|みんな|これ|それ|あれ|ごはん|おふろ|すし|ともだち|こども|なに|きのう|あした|きょう|いつ|さん|ちゃん)$/;
function particleItems() {
  const items = [];
  CARDS.forEach((c) => {
    if (c.t !== "g" || !inRange(c) || !c.ex) return;
    c.ex.split("\n").forEach((line, li) => {
      line = line.replace(/^[^：\s]{1,6}：/, "");
      if (/[→｜＝✗✓（(]/.test(line) || !/[ 　]/.test(line)) return;
      const toks = line.trim().split(/[ 　]+/);
      toks.forEach((tok, i) => {
        if (i === toks.length - 1) return;
        const p = PARTS.find((x) => tok.endsWith(x));
        if (!p) return;
        const pre = tok.slice(0, -p.length);
        if (!pre || /[にでへとか]$/.test(pre)) return;
        if (!(/[一-鿿ァ-ヶー0-9０-９]$/.test(pre) || HIRA_NOUN.test(pre))) return;
        const zh = (c.zh || "").split("\n")[li] || "";
        items.push({ card: c, toks, i, pre, ans: p, zh });
      });
    });
  });
  return items;
}

const markWeak = (card) => { if (card && !card.id.startsWith("x")) { S.c[card.id] = schedule(S.c[card.id], 0); save(); } };
const verbForms = () => ["te", "nai", "dict"].filter((f) => S.settings.cur >= { te: 14, nai: 17, dict: 18 }[f]);
/* ===== 弱點紀錄 ===== */
const SP_KEYS = ["m:joshi", "m:verb", "m:aloud"];
// 舊記錄冇 sp：用答啱減答錯補返
const spOf = (k) => { if (S.stats.sp[k] != null) return S.stats.sp[k]; const v = S.stats.cat[k]; return v ? Math.max(0, v[0] - (v[1] - v[0])) : 0; };
// cat：每類題目 [答啱, 總數]；wrong：最近答錯；read：讀句子速度（每秒字數）
function rec(keys, ok) {
  const c = S.stats.cat, rc = S.stats.rc;
  keys.forEach((k) => {
    // 能力值：答啱 +1，答錯 −1（要喺更新總數之前計）
    if (SP_KEYS.includes(k)) S.stats.sp[k] = Math.max(0, spOf(k) + (ok ? 1 : -1));
    const v = c[k] || (c[k] = [0, 0]); v[1]++; if (ok) v[0]++;
    rc[k] = ((rc[k] || "") + (ok ? "1" : "0")).slice(-30);

function sentenceItems() {

    const zhs = (c.zh || "").split("\n");
    c.ex.split("\n").forEach((line, li) => {
      const s = line.replace(/^[^：\s]{1,6}：/, "").trim();
      const n = s.replace(/[\s、。…？！]/g, "").length;
      if (/[→｜＝✗✓（(]/.test(s) || !/[ぁ-ん]/.test(s) || n < 6 || n > 45) return;

function buildQs(mode, n) {

    const pool = kanjiPool();
    return weightedPick(pool, n, (it) => cardW(it.card, ws.has(it.k)) * weakW("L" + it.card.L)).map((it) => {
      if (mode === "read") {
        const near = pool.filter((x) => x.r !== it.r && Math.abs(x.r.length - it.r.length) <= 1).map((x) => x.r);
        const src = [...new Set(near.length >= 3 ? near : pool.filter((x) => x.r !== it.r).map((x) => x.r))];
        const v = variant(it.r);
        const ds = v ? [v, ...pickN(src.filter((x) => x !== v), 2)] : pickN(src, 3);
        return { ...it, mode, ans: it.r, opts: shuffle([it.r, ...ds]) };
      }
      if (mode === "pick") {
        const chars = new Set(it.k.replace(/[^一-鿿]/g, ""));
        const share = pool.filter((x) => x.k !== it.k && [...x.k].some((ch) => chars.has(ch))).map((x) => x.k);
        const ds = pickN(share, 2);
        const rest = pool.map((x) => x.k).filter((x) => x !== it.k && !ds.includes(x));

  slot.innerHTML = `<div class="ai-box"><span class="muted" id="aiSt">Claude 諗緊…</span><div class="ai-out" id="aiTx"></div></div>`;
  const st = slot.querySelector("#aiSt"), out = slot.querySelector("#aiTx");
  const sample = await getSample();
  if (!sample) { st.textContent = "呢度用唔到 Claude（要喺 claude.ai 打開）"; return; }
  if (btn) btn.disabled = true;
  let text = null;
  try {
    const res = await sample(prompt, { onText: ({ text: t }) => { out.textContent = t; st.textContent = ""; } });
    st.textContent = ""; text = res.text;
  } catch (e) {
    st.textContent = { not_granted: "你未允許呢頁用 Claude", rate_limited: "太密喇，等一陣再試" }[e && e.code] || "Claude 暫時答唔到，等陣再試";
  }
  if (btn) btn.disabled = false;
  return text;
}

const TITLES = [[1, "見習生"], [3, "冒險者"], [6, "戰士"], [10, "騎士"], [15, "勇者"], [20, "傳說"]];
const playerLv = () => Math.floor(Math.sqrt(S.game.xp / 25)) + 1;
const lvXP = (lv) => 25 * (lv - 1) * (lv - 1);
const titleOf = (lv) => TITLES.filter(([n]) => lv >= n).pop()[1];
function addXP(n, raw) {
  const before = playerLv();
  S.game.xp += raw ? n : Math.round(n * xpMult());
  const after = playerLv();
  if (after > before) levelUp(after);
  updateMeta();
}
function levelUp(lv) {
  const t = document.getElementById("lvup");
  t.innerHTML = `<b>LEVEL UP!</b><span>Lv.${lv} ${titleOf(lv)}</span>`;
  t.hidden = false;
  clearTimeout(levelUp.t);
  levelUp.t = setTimeout(() => (t.hidden = true), 2600);
}

/* ===== 連續日數、每日目標、寶箱、成就 ===== */
// EXP 代表努力，永遠唔扣；能力值代表實力，答錯會扣
function streakInfo() {
  const g = S.settings.goal, fr = new Set(S.game.frozen);
  const ok = (d) => (S.log[d] || 0) >= g || fr.has(d);
  let d = today(), n = 0;
  if (!ok(d)) d--; // 今日未完成唔計，但都未斷
  while (ok(d)) { n++; d--; }
  return { n, done: (S.log[today()] || 0) >= g, cnt: S.log[today()] || 0 };
}
const xpMult = () => 1 + Math.min(0.5, streakInfo().n * 0.05);
// 漏咗一至兩日：有請假卡就自動補返
function applyFreeze() {
  const g = S.settings.goal, fr = new Set(S.game.frozen);
  const ok = (d) => (S.log[d] || 0) >= g || fr.has(d);
  const missed = [];
  let d = today() - 1;
  while (!ok(d) && missed.length < 3) { missed.push(d); d--; }
  if (!missed.length || !ok(d) || missed.length > S.game.freezes) return;
  S.game.frozen.push(...missed);
  S.game.freezes -= missed.length;
  toast(`用咗 ${missed.length} 張請假卡，連續日數保住咗！`);
  save(); RENDER[current]();
}
function tick() {
  const t = today(), before = S.log[t] || 0;
  S.log[t] = before + 1;
  if (before + 1 >= S.settings.goal && !S.game.chest[t]) goalDone(t);
}
function goalDone(t) {
  S.game.chest[t] = true;
  Object.keys(S.game.chest).map(Number).filter((d) => d < t - 60).forEach((d) => delete S.game.chest[d]);
  S.game.goalDays++;
  const n = streakInfo().n;
  let freeze = false;
  if (n % 7 === 0 && S.game.freezes < 2) { S.game.freezes++; freeze = true; }
  else if (Math.random() < 0.15 && S.game.freezes < 2) { S.game.freezes++; freeze = true; }
  const gold = Math.round((20 + Math.random() * 40) * xpMult());
  addXP(gold, true);
  celebrate(`<b class="game-font">今日目標完成！</b>
    <span class="big-fire">🔥 ${n}</span><span>連續 ${n} 日</span>
    <span class="chest">🎁 寶箱：+${gold} EXP${freeze ? " · ❄ 請假卡 +1" : ""}</span>
    <span class="muted">${n < 3 ? "聽日返嚟，連續 3 日有成就！" : `EXP 加成而家係 ×${xpMult().toFixed(2)}`}</span>`);
  checkAch();
}
function celebrate(html) {
  const el = document.getElementById("celebrate");
  el.innerHTML = `<div class="cele-box" role="dialog" aria-label="慶祝">${html}<button class="btn primary" id="celeOk">收下</button></div>`;
  el.hidden = false;
  document.getElementById("celeOk").onclick = () => { el.hidden = true; RENDER[current](); };
}

  const s = streakInfo(), g = S.settings.goal, pct = Math.min(100, Math.round((s.cnt / g) * 100)), dc = decayed();
  return `<div class="daily">

function achHtml() {

  return `<h2>成就 ${n}/${ACH.length}</h2>
    <div class="ach-grid">${ACH.map(([id, icon, name, desc]) => `<div class="ach ${S.game.ach[id] ? "" : "locked"}" title="${esc(desc)}"><span aria-hidden="true">${S.game.ach[id] ? icon : "🔒"}</span><b>${esc(name)}</b><small>${esc(desc)}</small></div>`).join("")}</div>`;
}
function calendarHtml() {
  const t = today(), g = S.settings.goal, fr = new Set(S.game.frozen);
  let cells = "";
  for (let d = t - 34; d <= t; d++) {
    const n = S.log[d] || 0, cls = n >= g ? "met" : fr.has(d) ? "frozen" : n ? "part" : "";
    cells += `<i class="${cls} ${d === t ? "today" : ""}" title="${dayLabel(d)}：${n} 題">${fr.has(d) && n < g ? "❄" : ""}</i>`;
  }
  return `<h2>最近 5 個星期</h2><div class="cal">${cells}</div>

}

        ${win && BOSSES[F.i + 1] ? `<p class="muted">解鎖咗 ${BOSSES[F.i + 1].id} ${esc(BOSSES[F.i + 1].name)}！</p>` : ""}

  el.innerHTML = `${arena}
    <div class="progress"><span>第 ${F.n + 1}/${F.qs.length} 題</span></div>
    <div class="card practice"><div class="face">${bossQuestion(q)}</div></div>
    <div class="opts ${q.kind === "m" || q.mode === "mean" ? "zh-opts" : ""}">${q.opts.map((o, j) => {
      const cls = done ? (o === q.ans ? "right" : o === F.picked ? "wrong" : "") : "";

    }).join("")}</div>
    ${done ? `<div class="answer verdict ${right ? "ok" : "ng"}"><b>${right ? "命中！" : "被反擊！"} ${deltaChip(q.mode === "bank" ? (q.kind === "g" ? "joshi" : "read") : q.mode, right)}</b>${bossFeedback(q)}</div>
      <div class="row"><button class="btn primary" id="bNext">${F.hits >= BOSS_HP ? "打低咗！睇結果" : F.hearts <= 0 ? "冇晒心……睇結果" : "繼續"}</button>${canSpeak ? `<button class="btn small" id="bSay">聽發音</button>` : ""}</div>` : ""}
    <div class="row"><button class="btn ghost small" id="bQuit">逃走</button></div>`;
  el.querySelectorAll(".opt").forEach((btn) => (btn.onclick = () => {

/* ===== 角色狀態（雷達圖） ===== */
// 能力值：由 0 開始，靠學識嘅嘢慢慢儲；目標跟住下一隻未打贏嘅 Boss 升
const RANK = (v) => (v == null ? "?" : v >= 99 ? "S" : v >= 80 ? "A" : v >= 60 ? "B" : v >= 40 ? "C" : v >= 20 ? "D" : "E");
const TIER_MULT = [1, 2, 4, 7, 12];
const STAT_BASE = { 語彙: 800, 漢字: 100, 文法: 120, 助詞: 150, 變化: 150, 閱讀: 150 };
const goalTier = () => { let t = 0; BOSSES.forEach((b, i) => { if ((bossRec(b.id) || {}).cleared) t = i + 1; }); return Math.min(t, BOSSES.length - 1); };
function mastery(c) {
  const st = S.c[c.id];
  if (!st) return 0;
  const m = st.i >= 21 ? 1 : st.i >= 7 ? 0.75 : st.i >= 3 ? 0.5 : st.r >= 1 ? 0.25 : 0;
  // 太耐冇溫（過咗溫習日好耐）會跌一半
  return today() - st.d > Math.max(3, st.i) ? m / 2 : m;
}
function bumpKanji(word, ok) {
  const kj = S.stats.kj;
  [...clean(word)].filter(hasKanji).forEach((ch) => { kj[ch] = Math.max(0, (kj[ch] || 0) + (ok ? 1 : -1)); });
}
function statPoints() {
  let voc = 0, gram = 0;
  const kset = new Set();
  CARDS.forEach((c) => {
    const m = mastery(c);
    if (c.t === "v") { voc += m; if (m >= 0.75) [...clean(c.kanji)].filter(hasKanji).forEach((ch) => kset.add(ch)); }
    else gram += m;
  });
  Object.entries(S.stats.kj).forEach(([ch, n]) => { if (n >= 3) kset.add(ch); });
  return {
    語彙: [voc, "字"], 漢字: [kset.size, "字"], 文法: [gram, "項"],
    助詞: [spOf("m:joshi"), "分"], 變化: [spOf("m:verb"), "分"],
    閱讀: [spOf("m:aloud") * Math.min(1, (readCps() || 0) / 3), "句"]
  };
}
function stat6() {
  const pts = statPoints(), mult = TIER_MULT[goalTier()];
  return Object.keys(STAT_BASE).map((name) => {
    const p = pts[name][0], tgt = Math.round(STAT_BASE[name] * mult);
    return { name, v: Math.min(99, Math.floor((p / tgt) * 99)), pts: Math.floor(p), tgt, unit: pts[name][1] };
  });
}
function radarSvg(st) {
  const cx = 130, cy = 120, R = 82, n = st.length;
  const pt = (i, r) => { const a = -Math.PI / 2 + (i * 2 * Math.PI) / n; return [cx + Math.cos(a) * r, cy + Math.sin(a) * r]; };
  const ring = (f) => st.map((_, i) => pt(i, R * f).map((x) => x.toFixed(1)).join(",")).join(" ");
  const poly = st.map((s, i) => pt(i, R * Math.max(0.04, (s.v || 0) / 99)).map((x) => x.toFixed(1)).join(",")).join(" ");
  const labels = st.map((s, i) => { const [x, y] = pt(i, R + 22); return `<text x="${x.toFixed(1)}" y="${y.toFixed(1)}" text-anchor="middle" dominant-baseline="middle" class="r-lab">${s.name}<tspan class="r-rank" dx="4">${RANK(s.v)}</tspan></text>`; }).join("");
  const axes = st.map((_, i) => { const [x, y] = pt(i, R); return `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" class="r-axis"/>`; }).join("");
  return `<svg class="radar" viewBox="0 0 260 240" role="img" aria-label="能力雷達圖：${st.map((s) => s.name + (s.v == null ? "未測" : s.v)).join("、")}">
    <polygon points="${ring(1)}" class="r-ring"/><polygon points="${ring(0.66)}" class="r-ring"/><polygon points="${ring(0.33)}" class="r-ring"/>
    ${axes}<polygon points="${poly}" class="r-val"/>${labels}</svg>`;
}
function statusWindow() {

      <div data-slot="${i}"></div>
    </article>`).join("") : `<p class="muted">呢課未有文法卡。你可以喺「設定」加，或者 send 老師筆記俾 Claude。</p>`}`;
  el.querySelectorAll("#gchips button").forEach((b) => (b.onclick = () => { gramL = +b.dataset.l; renderGrammar(); }));
  el.querySelectorAll("[data-say]").forEach((b) => (b.onclick = () => speak(items[+b.dataset.say].ex)));
  el.querySelectorAll("[data-ai]").forEach((b) => (b.onclick = () => openAI(items[+b.dataset.ai], el.querySelector(`[data-slot="${b.dataset.ai}"]`))));
  document.getElementById("cramG").onclick = () => startCram(gramL, "g");
}

/* ===== 進度 ===== */
function streak() {
  let n = 0, t = today();
  if (!S.log[t]) t--;
  while (S.log[t]) { n++; t--; }
  return n;
}
function renderStats() {
  const el = document.getElementById("v-stats");
  const scope = CARDS.filter(inScope);
  const counts = { new: 0, learning: 0, known: 0, due: 0 };
  scope.forEach((c) => counts[status(c)]++);
  const t = today();
  let rows = "";
  for (let L = 1; L <= maxLesson(); L++) {
    const cs = CARDS.filter((c) => c.L === L && (c.t === "v" || S.settings.gram));
    if (!cs.length) continue;
    const k = cs.filter((c) => status(c) === "known").length;
    const l = cs.filter((c) => ["learning", "due"].includes(status(c))).length;
    const [g, col] = GRADE(lessonScore(L));
    rows += `<div class="lrow"><span>第${L}課</span><div class="stack" title="記得 ${k}／學緊 ${l}／共 ${cs.length}"><i class="k" style="width:${(k / cs.length) * 100}%"></i><i class="l" style="width:${(l / cs.length) * 100}%"></i></div><span class="grade" style="color:var(${col})">${g}</span></div>`;
  }
  const weak = weakList();
  const totalDone = Object.entries(S.stats.cat).filter(([k]) => k.startsWith("m:") || k.startsWith("srs:")).reduce((a, [, v]) => a + v[1], 0);
  const rd = S.stats.read, avg = (a) => a.reduce((x, y) => x + y.cps, 0) / a.length;
  let speed = "";
  if (rd.length) {
    const pts = rd.slice(-30), max = Math.max(...pts.map((x) => x.cps), 1);
    const line = pts.map((x, i) => `${pts.length > 1 ? (i / (pts.length - 1)) * 196 + 2 : 100},${46 - (x.cps / max) * 40}`).join(" ");
    speed = `<h2>讀字速度</h2>
      <div class="tiles"><div class="tile"><b>${avg(rd.slice(-5)).toFixed(1)}</b><span>最近每秒讀幾多字</span></div>${rd.length >= 10 ? `<div class="tile"><b>${avg(rd.slice(0, 5)).toFixed(1)}</b><span>最初每秒讀幾多字</span></div>` : ""}</div>
      <svg class="spark" viewBox="0 0 200 50" preserveAspectRatio="none" role="img" aria-label="讀字速度走勢"><polyline points="${line}" fill="none" stroke="var(--ai)" stroke-width="2" vector-effect="non-scaling-stroke"/></svg>`;
  }
  if (snapshot()) save();
  const lv = levelOf(masteredLesson()), prev = pastSnap(7);
  const days = Object.keys(S.log).map(Number).sort((a, b) => a - b);
  const memory = days.length
    ? `你嘅記錄儲存咗喺你個 Claude 帳戶：由 ${dayLabel(days[0])} 開始，溫咗 ${days.length} 日，學過 ${Object.keys(S.c).length} 張卡。${stateRef ? (lastSync ? "啱啱同步咗。" : "已經同步。") : "（而家喺 claude.ai 以外打開，記錄暫時只喺呢部機。）"}`
    : "開始溫習之後，進度會儲存喺你個 Claude 帳戶，換手機都記得。";
  const dimRows = DIMS.map((d) => {
    const n = d.k === "read" ? S.stats.read.length : (S.stats.rc[d.k] || "").length || (S.stats.cat[d.k] || [0, 0])[1];
    const v = dimScore(d.k), pct = v == null ? null : Math.round(v * 100);
    const [g, col] = n >= 10 ? GRADE(v) : [n ? `再做 ${10 - n} 題` : "未測", "--ink-soft"];
    const was = prev && prev[d.k] != null ? prev[d.k] : null, diff = pct != null && was != null ? pct - was : 0;
    const extra = d.k === "read" && readCps() != null ? `（每秒 ${readCps().toFixed(1)} 字）` : "";
    return `<tr><th scope="row">${d.name}<small>${extra}</small></th>
      <td class="bar-cell"><div class="meter"><i style="width:${pct || 0}%;background:var(${col})"></i></div></td>
      <td class="num">${pct == null ? "–" : pct}</td>
      <td><span class="grade" style="color:var(${col})">${g}</span></td>
      <td class="num diff">${diff > 0 ? `<span class="up">▲${diff}</span>` : diff < 0 ? `<span class="down">▼${-diff}</span>` : ""}</td></tr>`;
  }).join("");
  const lastNote = S.notes[0];
  const ability = `
    ${statusWindow()}
    ${dailyCard()}
    ${achHtml()}
    <p class="memory">${esc(memory)}</p>
    <h2>答啱率分析</h2>
    <div class="table-wrap"><table class="ability">
      <thead><tr><th scope="col">能力</th><th scope="col"></th><th scope="col" class="num">答啱率</th><th scope="col">等級</th><th scope="col" class="num">對比上星期</th></tr></thead>
      <tbody>${dimRows}</tbody></table></div>
    <p class="muted">答啱率用最近 30 題計，做夠 10 題先評級。答啱率高唔代表能力值高，要學得多先會升。</p>
    ${lastNote ? `<details class="recent"><summary>上次 Claude 分析（${dayLabel(lastNote.d)}）</summary><div class="ai-out">${esc(lastNote.t)}</div></details>` : ""}`;
  const analysis = `<h2>你嘅弱點</h2>
    ${weak.length ? `<div class="weaks">${weak.map((w) => `<div class="weak">
      <div class="top"><b>${esc(catName(w.k))}</b><span class="muted">答啱 ${w.ok}/${w.n}</span></div>
      <div class="meter"><i style="width:${Math.round(w.a * 100)}%;background:var(${w.a < 0.5 ? "--shu" : w.a < 0.7 ? "--yamabuki" : "--matcha"})"></i></div>
      ${CAT_TIP[w.k] ? `<div class="tip">${esc(CAT_TIP[w.k])}</div>` : ""}
      <div><button class="btn small" data-train="${esc(w.k)}">練呢樣</button></div></div>`).join("")}</div>`
      : `<p class="muted">${totalDone < 10 ? "做多啲溫習同練習（大約 20 題），我就分析到你邊度弱。" : "暫時冇明顯弱點，繼續保持！"}</p>`}
    ${S.stats.wrong.length ? `<details class="recent"><summary>最近答錯（${Math.min(S.stats.wrong.length, 10)}）</summary><ul class="list">${S.stats.wrong.slice(0, 10).map((w) => `<li><i class="dot due"></i><div class="w">${esc(w.a)}</div><div class="m">${esc(w.b || "")}</div><span class="muted">${esc(modeName(w.m) || "溫習")}</span></li>`).join("")}</ul></details>` : ""}
    ${totalDone >= 10 ? `<div class="row"><button class="btn" id="aiAnalyse">叫 Claude 詳細分析</button></div><div id="aiAn"></div>` : ""}`;
  el.innerHTML = `${ability}
    ${analysis}
    ${speed}
    <h2>溫習</h2>
    <div class="tiles">
      <div class="tile"><b>${counts.due}</b><span>今日要溫</span></div>
      <div class="tile"><b>${S.log[t] || 0}</b><span>今日溫咗</span></div>
      <div class="tile"><b>${streak()}</b><span>連續日數</span></div>
      <div class="tile"><b>${counts.known}</b><span>記得（7日以上）</span></div>
    </div>
    ${calendarHtml()}
    <h2>每課掌握程度</h2>
    <div class="legend"><span><i class="dot known"></i>記得</span><span><i class="dot learning"></i>學緊</span><span><i class="dot"></i>未學</span><span>右邊＝練習答啱率等級</span></div>
    <div class="lessons">${rows}</div>
    <p class="muted">一星期一堂嘅話，每日溫 10 分鐘最有效。</p>`;
  el.querySelectorAll("[data-train]").forEach((b) => (b.onclick = () => {
    const t = practiceFor(b.dataset.train);
    P.mode = t.mode; P.range = t.range; startRun(); go("practice");
  }));
  document.getElementById("doTest").onclick = () => { P.mode = "test"; startRun(); go("practice"); };
  document.getElementById("toBoss").onclick = () => go("boss");
  const an = document.getElementById("aiAnalyse");
  if (an) an.onclick = async () => {
    const cats = Object.entries(S.stats.cat).filter(([k]) => catName(k)).map(([k, v]) => `${catName(k)}：${v[0]}/${v[1]}`).join("；");
    const wr = S.stats.wrong.slice(0, 20).map((w) => `${modeName(w.m) || "溫習"}｜${w.a}｜${w.b || ""}`).join("\n");
    const sp = rd.length ? `讀字速度：最初每秒 ${avg(rd.slice(0, 5)).toFixed(1)} 字，最近每秒 ${avg(rd.slice(-5)).toFixed(1)} 字。` : "";
    const dimTxt = DIMS.map((d) => { const v = dimScore(d.k); return `${d.name} ${v == null ? "未測" : Math.round(v * 100) + "分"}${prev && prev[d.k] != null ? `（上星期 ${prev[d.k]}）` : ""}`; }).join("；");
    const before = lastNote ? `\n上次（${dayLabel(lastNote.d)}）你俾佢嘅分析：\n${lastNote.t}\n` : "";
    const text = await askClaude(`你係一位日文老師，學生講廣東話，用《みんなの日本語》，一星期上一堂。佢話自己睇字慢，成日唔記得漢字同文法。\n程度估算：${lv.name}，${lv.sub}。\n能力分數：${dimTxt}\n練習數據（答啱/總數）：${cats}\n${sp}\n最近答錯：\n${wr}\n${before}\n請用廣東話口語分析，要好短（佢睇字慢）：\n1. ${lastNote ? "同上次比，邊度進步咗、邊度仲未得（一句）" : "佢而家大約咩程度（一句）"}\n2. 佢最弱嘅三樣嘢（每樣一句，講出錯誤規律）\n3. 下個星期每日 10 分鐘點樣練（例如邊種練習、幾多題）\n唔好用 markdown 標題或粗體，每點一行。`, document.getElementById("aiAn"), an);
    if (text) { S.notes.unshift({ d: today(), t: text }); S.notes.length = Math.min(S.notes.length, 10); save(); }
  };
}

/* ===== 設定 ===== */
let user = null;
function renderSetup() {
  const el = document.getElementById("v-setup");
  const st = S.settings;
  let opts = ""; for (let L = 1; L <= maxLesson(); L++) opts += `<option value="${L}" ${L === st.cur ? "selected" : ""}>第${L}課</option>`;
  el.innerHTML = `
    <form class="form" id="setForm">
      <h2>學習設定</h2>
      <div class="two">
        <label for="sCur">而家上到<select id="sCur">${opts}</select></label>
        <label for="sNew">每日新卡數量<input type="number" id="sNew" min="0" max="100" value="${st.newPerDay}"></label>
      </div>
      <label for="sGoal">每日目標（做幾多題）<select id="sGoal">${[10, 15, 25, 40].map((n) => `<option value="${n}" ${st.goal === n ? "selected" : ""}>${n} 題${n === 15 ? "（大約 10 分鐘）" : ""}</option>`).join("")}</select></label>
      <label for="sDir">生字卡方向
        <select id="sDir"><option value="jz" ${st.dir === "jz" ? "selected" : ""}>睇日文 → 諗意思</option><option value="zj" ${st.dir === "zj" ? "selected" : ""}>睇中文 → 諗日文（較難）</option></select>
      </label>
      <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="sGram" ${st.gram ? "checked" : ""}> 每日溫習包括文法卡</label>
      <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="sBig" ${st.big ? "checked" : ""}> 大字模式（字大啲、易睇啲）</label>
      <label style="display:flex;gap:8px;align-items:center;color:var(--ink)"><input type="checkbox" id="sAuto" ${st.auto ? "checked" : ""}> 睇答案時自動讀出發音</label>
      <p class="muted">每次上完堂，記得將「而家上到」改成新嗰課，新課嘅卡就會開始出現。</p>
    </form>
    <form class="form" id="addForm">
      <h2>加卡（老師筆記）</h2>
      <div class="two">
        <label for="aType">類型<select id="aType"><option value="v">生字</option><option value="g">文法</option></select></label>
        <label for="aL">第幾課<input type="number" id="aL" min="1" max="50" value="${st.cur}"></label>
      </div>
      <div class="two">
        <label for="aJp"><span id="aJpLbl">日文（漢字）</span><input type="text" id="aJp" placeholder="例：曲がります"></label>
        <label for="aKana"><span id="aKanaLbl">讀音（假名）</span><input type="text" id="aKana" placeholder="例：まがります"></label>
      </div>
      <label for="aMean">意思<input type="text" id="aMean" placeholder="例：轉（彎）"></label>
      <label for="aNote">例句／補充（可以唔填）<textarea id="aNote" placeholder="例：信号を右へ曲がってください。"></textarea></label>
      <div class="row"><button class="btn primary" type="submit">加入</button><span class="muted" id="addState"></span></div>
    </form>
    <div class="form">
      <h2>重設</h2>
      <p class="muted">清除所有溫習紀錄，由頭開始。老師筆記唔會刪除。</p>
      <div class="row" id="resetRow"><button class="btn danger" id="reset">清除進度</button></div>
      <p class="muted" id="syncNote"></p>
    </div>`;
  const upd = () => {
    st.cur = +document.getElementById("sCur").value;
    st.newPerDay = Math.max(0, Math.min(100, +document.getElementById("sNew").value || 0));
    st.dir = document.getElementById("sDir").value;
    st.gram = document.getElementById("sGram").checked;
    st.big = document.getElementById("sBig").checked;
    st.goal = +document.getElementById("sGoal").value;
    st.auto = document.getElementById("sAuto").checked;
    session = null; save(); updateMeta();
  };
  el.querySelectorAll("#setForm select, #setForm input").forEach((i) => (i.onchange = upd));
  document.getElementById("setForm").onsubmit = (e) => e.preventDefault();
  const aType = document.getElementById("aType");
  aType.onchange = () => {
    const g = aType.value === "g";
    document.getElementById("aJpLbl").textContent = g ? "句型" : "日文（漢字）";
    document.getElementById("aKanaLbl").textContent = g ? "例句（日文）" : "讀音（假名）";
  };
  document.getElementById("addForm").onsubmit = async (e) => {
    e.preventDefault();
    const stEl = document.getElementById("addState");
    const g = aType.value === "g";
    const L = +document.getElementById("aL").value || st.cur;
    const jp = document.getElementById("aJp").value.trim(), kana = document.getElementById("aKana").value.trim();
    const mean = document.getElementById("aMean").value.trim(), note = document.getElementById("aNote").value.trim();
    if (!(jp || kana) || !mean) { stEl.textContent = "要填日文同意思"; return; }
    const doc = g ? { t: "g", L, p: jp || kana, ex: g ? kana : "", mean, note, src: "page" }
                  : { t: "v", L, kanji: kana ? jp : "", kana: kana || jp, mean, note, src: "page" };
    if (!db) { stEl.textContent = "要喺 claude.ai 打開先可以儲存老師筆記"; return; }
    try { await db.collection("cards").add(doc); stEl.textContent = "已加入第" + L + "課"; e.target.reset(); document.getElementById("aL").value = st.cur; }
    catch (err) { stEl.textContent = err && err.code === "invalid_argument" ? "你冇權限加卡" : "加唔到，等陣再試"; }
  };
  document.getElementById("reset").onclick = () => {
    const row = document.getElementById("resetRow");
    row.innerHTML = `<span>真係清除晒？</span><button class="btn danger" id="resetYes">確定清除</button><button class="btn" id="resetNo">取消</button>`;
    document.getElementById("resetNo").onclick = renderSetup;
    document.getElementById("resetYes").onclick = () => { const keep = S.settings; S = freshState(); S.settings = keep; session = null; save(); toast("已清除進度"); renderSetup(); };
  };
  document.getElementById("syncNote").textContent = stateRef ? "進度已同步到你嘅 Claude 帳戶，手機同電腦都睇到。" : "進度暫時只存喺呢個瀏覽器。";
}

/* ===== 導航 ===== */
let current = "today";
const RENDER = { today: renderToday, practice: renderPractice, boss: renderBoss, vocab: renderVocab, grammar: renderGrammar, stats: renderStats, setup: renderSetup };
function go(v) {
  current = v;
  document.querySelectorAll("#tabs button").forEach((b) => b.setAttribute("aria-selected", b.dataset.v === v));
  for (const k of Object.keys(RENDER)) document.getElementById("v-" + k).hidden = k !== v;
  RENDER[v]();
  window.scrollTo(0, 0);
}
document.querySelectorAll("#tabs button").forEach((b) => (b.onclick = () => go(b.dataset.v)));
function updateMeta() {
  const due = CARDS.filter((c) => inScope(c) && S.c[c.id] && S.c[c.id].d <= today()).length;
  document.getElementById("meta").innerHTML = `<span class="game-font hud-lv">Lv.${playerLv()}</span> 🔥${streakInfo().n} · ${esc(predicted().name)} · ${due} 張到期`;
  document.body.classList.toggle("big", !!S.settings.big);
}
let toastT;
function toast(m) { const t = document.getElementById("toast"); t.textContent = m; t.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => (t.hidden = true), 2400); }

vocabL = gramL = S.settings.cur;
const start = /^(today|practice|boss|vocab|grammar|stats|setup)$/.test(location.hash.slice(1)) ? location.hash.slice(1) : "today";
go(start);
applyFreeze();

/* ===== 雲端同步（db + user） ===== */
(async () => {
  if (!window.claude || !window.claude.use) return;
  const [d, u] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
  user = u;
  if (!d) return;
  db = d;
  d.collection("cards").onSnapshot((snap) => {
    custom = snap.docs.map((doc) => {
      const x = doc.data() || {};
      return { id: "c:" + doc.id, t: x.t === "g" ? "g" : "v", L: +x.L || 1, kana: x.kana || "", kanji: x.kanji || "", p: x.p || "", mean: x.mean || "", ex: x.ex || "", zh: x.zh || "", note: x.note || "", src: x.src || "teacher" };
    }).filter((c) => (c.t === "v" ? c.kana || c.kanji : c.p) && c.mean);
    rebuildCards();
    if (current !== "today" || !session || session.i >= session.q.length) { if (current === "today") session = null; RENDER[current](); }
    updateMeta();
  }, () => {});
  d.collection("memo").onSnapshot((snap) => {
    snap.docs.forEach((doc) => { const x = doc.data() || {}; if (x.ch && x.story) customMemo[x.ch] = [String(x.emoji || ""), String(x.parts || ""), String(x.story)]; });
  }, () => {});
  const uid = u ? await u.id() : null;
  if (!uid) return;
  stateRef = d.doc("data/users/" + uid + "/state");
  try {
    const snap = await stateRef.get();
    const remote = snap.exists ? normalize(JSON.parse(JSON.stringify(snap.data()))) : null;
    if (remote && remote.upd > (S.upd || 0)) {
      S = remote;
      try { localStorage.setItem(LS_KEY, JSON.stringify(S)); } catch (e) {}
      session = null; applyFreeze(); RENDER[current]();
    } else if (S.upd > 0) {
      saveRemote();
    }
  } catch (e) {}
  if (current === "setup") renderSetup();
})();
</script>
